name: 쿠폰 데이터 자동 업데이트

on:
  schedule:
    - cron: "0 1 1,4,7,10,13,16,19,22,25,28,30 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coupons
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 쿠폰 수집
        run: python scripts/update_coupons.py

      - name: 데이터 검증
        run: python scripts/update_coupons.py --check

      - name: 변경분 커밋
        run: |
          git config user.name "coupon-library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coupons.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 쿠폰 데이터 업데이트 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
