<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>쿠폰콕 화면 점검</title>
<style>
  body{margin:0;background:#e9e6df;font:13px/1.4 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:16px;padding:12px;align-items:flex-start}
  .phone{background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.15)}
  figure{margin:0}
  figcaption{font-weight:700;color:#333;padding:6px 2px}
  iframe{border:0;display:block}
</style></head>
<body>
  <figure><figcaption>375 × 812 · 홈</figcaption><iframe class="phone" data-w="375" data-h="812" data-view=""></iframe></figure>
  <figure><figcaption>430 × 812 · 홈</figcaption><iframe class="phone" data-w="430" data-h="812" data-view=""></iframe></figure>
  <figure><figcaption>375 × 812 · 쇼핑·직구 목록</figcaption><iframe class="phone" data-w="375" data-h="812" data-view="#/zip/deal"></iframe></figure>
<script>
  document.querySelectorAll('iframe[data-w]').forEach((f) => {
    const v = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    f.width = f.dataset.w;
    f.height = f.dataset.h;
    f.src = './index.html?v=' + v + (f.dataset.view || '');
  });
</script>
</body></html>
