<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쿠폰라이브러리 — 조건 맞춘 할인코드·전용 링크 모음</title>
<meta name="description" content="첫구매·카드·멤버십 등 조건이 붙은 할인코드와 전용 링크만 모았습니다. 할인 혜택, 적용 방법, 사용 기한을 한눈에 확인하고 바로 이동하세요.">
<meta name="robots" content="index, follow">
<link rel="stylesheet" href="./styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f5bea'/%3E%3Cpath d='M18 22h28v8a6 6 0 0 0 0 12v8H18v-8a6 6 0 0 0 0-12z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<a class="skip" href="#list">쿠폰 목록으로 바로가기</a>

<header class="site-header">
  <div class="wrap header-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16v4.2a2.8 2.8 0 0 0 0 5.6V20H4v-4.2a2.8 2.8 0 0 0 0-5.6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </span>
      <div>
        <h1>쿠폰라이브러리</h1>
        <p class="brand-sub">조건이 붙은 진짜 쿠폰만 모았습니다</p>
      </div>
    </div>
    <div class="header-meta">
      <span class="dot" id="status-dot" aria-hidden="true"></span>
      <span id="updated">불러오는 중…</span>
    </div>
  </div>
</header>

<div class="controls">
  <div class="wrap">
    <div class="search-row">
      <label class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="플랫폼·혜택 검색 (예: 첫구매, VISA, 30%)" autocomplete="off" aria-label="쿠폰 검색">
      </label>
      <p class="count" id="count" aria-live="polite"></p>
    </div>

    <nav class="tabs" id="category-tabs" aria-label="카테고리"></nav>
    <div class="chips" id="platform-chips" aria-label="플랫폼 선택"></div>
    <div class="chips types" id="type-chips" aria-label="유형 선택"></div>
  </div>
</div>

<main class="wrap" id="list">
  <div id="content"></div>
  <p class="empty" id="empty" hidden>조건에 맞는 쿠폰이 없습니다. 검색어나 필터를 바꿔 보세요.</p>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p><strong>쿠폰라이브러리</strong>는 공개된 프로모션 정보를 모아 정리합니다. 로그인·회원가입·개인정보 수집 없이 누구나 볼 수 있습니다.</p>
    <p>표시된 혜택과 기한은 각 플랫폼 사정에 따라 바뀔 수 있으니 결제 전 해당 사이트에서 한 번 더 확인하세요. 사용 기한이 명시되지 않은 쿠폰은 “사용 기한 표기 없음”으로 표시합니다.</p>
    <p class="muted">데이터 출처: 공개 프로모션 페이지 · 마지막 수집 <span id="updated-foot">-</span></p>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="./app.js" defer></script>
</body>
</html>
